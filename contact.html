<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Stanley Nguyen | Web Design Portfolio</title>
    <link rel="stylesheet" href="css/style.css"> <!-- link css file to html -->
    <script src="js/script.js" defer></script> <!-- link script.js file to html -->
 
</head>
<body>
    <header>
       <h1>my-portfolio</h1>
       <h2>Stanley Nguyen</h2>
       <nav>
          <a href="index.html">Home</a>
          <a href="projects.html">Projects</a>
          <a href="contact.html">Contact</a>
       </nav>
    </header>

     <section id="contact"> <!-- Chapter 3, Step 3.1: Plan the Form Structure -->
        <h2>Get in Touch</h2>

        <div id="form-notification"> Message sent successfully! Thank you for contacting me. </div> <!-- Extra circular-->

        <form id="contact-form"> 
            <label for="name">Name </label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <small class="error-message" id="name-error"></small>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <small class="error-message" id="email-error"></small>

            <label for="phone">Phone *</label>
            <input type="phone" id="phone" name="phone" placeholder="Enter your phone number" required>
            <small class="error-message" id="phone-error"></small>

            <label for="message">Message *</label>
            <textarea id="message" name="message" placeholder="Enter your message" required></textarea>
            <small class="error-message" id="message-error"></small>

            <button type="submit">Send</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <p>&copy; 2026 Stanley Nguyen</p>
            <p>Web Programming and Design - CPAN134 </p>
        </div>
    </footer>

    <button id="topBtn" title="Back up">↑</button>
</body>
